# Prices in USD per 1M tokens, checked 17 Oct 2026 on developers.openai.com/api/docs/pricing
# Batch and Flex are 50 percent of standard on both OpenAI models.

tier0:
  model: Qwen/Qwen3-4B-Instruct-2507
  provider: kaggle
  # Kaggle compute is free, so this is a modelling choice, not a bill.
  # Sweep it in analysis (0, 0.02/0.08, 0.05/0.20) and report all three.
  nominal_price_in: 0.02
  nominal_price_out: 0.08
  max_new_tokens: 24
  n_samples: 5            # extra sampled answers for self consistency, free on Kaggle
  sample_temperature: 0.7

tier1:
  model: gpt-6-luna
  provider: openai
  reasoning_effort: none  # required for logprobs on GPT-6
  price_in: 0.10
  price_out: 0.50
  batch_discount: 0.5
  max_completion_tokens: 24
  top_logprobs: 5

tier2:
  model: gpt-6-sol        # not 6.1, which drops effort none and therefore logprobs
  provider: openai
  reasoning_effort: none
  price_in: 2.00
  price_out: 10.00
  batch_discount: 0.5
  max_completion_tokens: 24
  top_logprobs: 5

# Hard stop for any single cache command, on top of the dashboard spend limit
max_usd_per_command: 8.00
